name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Also enables KVM, which make-disk-image uses to install the system.
      # Arm runners have no /dev/kvm, so the kvm feature is declared anyway and
      # QEMU falls back to software emulation there.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: extra-system-features = kvm

      - name: Build images
        run: |
          nix eval --json .#packages.${{ matrix.system }} --apply builtins.attrNames |
            jq -r '.[] | ".#packages.${{ matrix.system }}." + .' |
            xargs nix build --print-build-logs

      - name: Collect images
        run: |
          mkdir dist
          cp -L result*/nixos-* dist/
          ls -l dist

      # GitHub rejects release assets of 2 GiB or more.
      - name: Check image sizes
        run: |
          if find dist -type f -size +2G | grep .; then
            echo "::error::Images must be under 2 GiB to attach to a release"
            exit 1
          fi

      - name: Upload images
        uses: actions/upload-artifact@v7
        with:
          name: images-${{ matrix.system }}
          path: dist/

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    timeout-minutes: 15
    steps:
      - name: Create Release PR
        id: release
        uses: googleapis/release-please-action@v5
        with:
          manifest-file: .github/config/release-please-manifest.json
          config-file: .github/config/release-please-config.json
          target-branch: main

  # Releases created with GITHUB_TOKEN don't trigger other workflows, so the
  # images built above are attached here rather than on a tag push.
  publish:
    needs: release
    if: needs.release.outputs.release_created
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Download images
        uses: actions/download-artifact@v8
        with:
          pattern: images-*
          merge-multiple: true
          path: dist

      - name: Checksum images
        working-directory: dist
        run: |
          sha256sum -- nixos-* > SHA256SUMS
          cat SHA256SUMS

      - name: Attach images to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
