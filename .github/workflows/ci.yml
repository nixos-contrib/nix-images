name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Also enables KVM, which make-disk-image uses to install the system.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Build images
        run: |
          nix eval --json .#packages.x86_64-linux --apply builtins.attrNames |
            jq -r '.[] | ".#" + .' |
            xargs nix build --print-build-logs

      - name: Collect images
        run: |
          mkdir dist
          cp -L result*/nixos-* dist/
          cd dist
          sha256sum -- nixos-* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload images
        uses: actions/upload-artifact@v7
        with:
          name: images
          path: dist/

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    timeout-minutes: 15
    steps:
      - name: Create Release PR
        id: release
        uses: googleapis/release-please-action@v5
        with:
          manifest-file: .github/config/release-please-manifest.json
          config-file: .github/config/release-please-config.json
          target-branch: main

  # Releases created with GITHUB_TOKEN don't trigger other workflows, so the
  # images built above is attached here rather than on a tag push.
  publish:
    needs: release
    if: needs.release.outputs.release_created
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Download images
        uses: actions/download-artifact@v8
        with:
          name: images
          path: dist

      - name: Attach images to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
